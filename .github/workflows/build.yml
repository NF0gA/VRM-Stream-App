name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: vrm-stream-app-linux
          path: dist/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: vrm-stream-app-windows
          path: dist/*
